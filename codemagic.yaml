workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
    scripts:
      - name: Backup custom files
        script: |
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          cp -r lib /tmp/backup/lib

      - name: Clean environment
        script: flutter clean

      - name: Scaffold Flutter project (generate android folder)
        script: |
          flutter create --platforms=android --project-name humidity_meter --org com.cobiin --no-pub .

      - name: Restore custom files
        script: |
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/backup/lib lib

      - name: Apply custom AndroidManifest with USB permissions
        script: |
          cp overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp overlay/usb_device_filter.xml android/app/src/main/res/xml/usb_device_filter.xml

      - name: Flutter pub get
        script: flutter pub get

      - name: Patch Gradle files (compileSdk 34 & minSdk 21)
        script: |
          # 1. Forzar compileSdkVersion 34 en los plugins de pub-cache
          find ~/.pub-cache -type f -name "*.gradle" -exec sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' {} +
          find ~/.pub-cache -type f -name "*.gradle" -exec sed -i 's/compileSdk 33/compileSdk 34/g' {} +
          find ~/.pub-cache -type f -name "*.gradle.kts" -exec sed -i 's/compileSdk = 33/compileSdk = 34/g' {} +
          
          # 2. Forzar compileSdkVersion 34 en el proyecto Android
          find android -type f -name "*.gradle" -exec sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' {} +
          find android -type f -name "*.gradle" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' {} +
          find android -type f -name "*.gradle.kts" -exec sed -i 's/compileSdk = 33/compileSdk = 34/g' {} +
          find android -type f -name "*.gradle.kts" -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' {} +

          # 3. Forzar minSdkVersion 21 (requerido por usb_serial)
          find android -type f -name "*.gradle" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' {} +
          find android -type f -name "*.gradle.kts" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' {} +

      - name: Build APK
        script: |
          flutter build apk --debug
          echo "--- Buscando APKs generados ---"
          find build -name "*.apk" || true

    artifacts:
      # Ampliamos la ruta por si Gradle lo guarda en un directorio alternativo
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/apk/**/*.apk