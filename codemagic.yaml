workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
    scripts:
      - name: Backup custom files
        script: |
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          cp -r lib /tmp/backup/lib

      - name: Clean environment
        script: |
          flutter clean
          rm -rf .dart_tool build pubspec.lock

      - name: Scaffold Flutter project (no pub)
        script: |
          flutter create --platforms=android --project-name humidity_meter --org com.cobiin --no-pub .

      - name: Restore custom files
        script: |
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/backup/lib lib

      - name: Apply custom AndroidManifest with USB permissions
        script: |
          cp overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp overlay/usb_device_filter.xml android/app/src/main/res/xml/usb_device_filter.xml

      - name: Flutter pub get
        script: flutter pub get

      - name: Patch usb_serial jcenter fix
        script: |
          # Reemplaza jcenter() por mavenCentral() en el plugin usb_serial
          sed -i 's/jcenter()/mavenCentral()/g' ~/.pub-cache/hosted/pub.dev/usb_serial-0.5.2/android/build.gradle || true

      - name: Patch Android build.gradle (minSdk)
        script: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Build APK
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk