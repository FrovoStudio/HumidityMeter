workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
    scripts:
      - name: Backup custom files
        script: |
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          cp -r lib /tmp/backup/lib

      - name: Scaffold Flutter project (generate android folder)
        script: |
          flutter create --platforms=android --project-name humidity_meter --org com.cobiin --no-pub .

      - name: Restore custom files
        script: |
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/backup/lib lib

      - name: Apply custom AndroidManifest with USB permissions
        script: |
          cp overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp overlay/usb_device_filter.xml android/app/src/main/res/xml/usb_device_filter.xml

      - name: Apply Kotlin compatibility flags
        script: |
          echo "android.builtInKotlin=false" >> android/gradle.properties
          echo "android.newDsl=false" >> android/gradle.properties

      - name: Flutter pub get
        script: flutter pub get

      - name: Force compileSdkVersion for all subprojects
        script: |
          # Inyecta la configuración usando echo para evitar errores de formato YAML
          echo '' >> android/build.gradle
          echo 'subprojects {' >> android/build.gradle
          echo '    afterEvaluate { project ->' >> android/build.gradle
          echo '        if (project.plugins.hasPlugin("com.android.application") || project.plugins.hasPlugin("com.android.library")) {' >> android/build.gradle
          echo '            project.android {' >> android/build.gradle
          echo '                compileSdkVersion 34' >> android/build.gradle
          echo '            }' >> android/build.gradle
          echo '        }' >> android/build.gradle
          echo '    }' >> android/build.gradle
          echo '}' >> android/build.gradle

      - name: Build APK
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk