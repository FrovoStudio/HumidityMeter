workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
    scripts:
      - name: Backup custom files
        script: |
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          cp -r lib /tmp/backup/lib

      - name: Clean environment
        script: flutter clean

      - name: Scaffold Flutter project
        script: |
          flutter create --platforms=android --project-name humidity_meter --org com.cobiin --no-pub .

      - name: Restore custom files
        script: |
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/backup/lib lib

      - name: Apply custom AndroidManifest
        script: |
          cp overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp overlay/usb_device_filter.xml android/app/src/main/res/xml/usb_device_filter.xml

      - name: Flutter pub get
        script: flutter pub get

      - name: Patch Android SDK versions (Robust)
        script: |
          # 1. Parchear el plugin usb_serial en la caché de paquetes
          find ~/.pub-cache -path "*usb_serial*/android/build.gradle" -exec sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' {} +
          find ~/.pub-cache -path "*usb_serial*/android/build.gradle" -exec sed -i 's/compileSdk 33/compileSdk 34/g' {} +
          find ~/.pub-cache -path "*usb_serial*/android/build.gradle.kts" -exec sed -i 's/compileSdk = 33/compileSdk = 34/g' {} +
          
          # 2. Parchear el proyecto principal (Groovy)
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi
          
          # 3. Parchear el proyecto principal (Kotlin DSL)
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
          fi

      - name: Build APK
        script: |
          flutter build apk --debug
          echo "--- Buscando el APK generado ---"
          find . -name "*.apk"

    artifacts:
      # Aquí le decimos a Codemagic que busque en todas las rutas posibles
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/apk/debug/*.apk
      - build/**/*.apk