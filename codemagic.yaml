workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
    scripts:
      - name: Backup custom files
        script: |
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          cp -r lib /tmp/backup/lib

      - name: Scaffold Flutter project (generate android folder)
        script: |
          flutter create --platforms=android --project-name humidity_meter --org com.cobiin --no-pub .

      - name: Restore custom files
        script: |
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/backup/lib lib

      - name: Apply custom AndroidManifest with USB permissions
        script: |
          cp overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp overlay/usb_device_filter.xml android/app/src/main/res/xml/usb_device_filter.xml

      - name: Apply Kotlin compatibility flags
        script: |
          echo "android.builtInKotlin=false" >> android/gradle.properties
          echo "android.newDsl=false" >> android/gradle.properties

      - name: Flutter pub get
        script: flutter pub get

      - name: Patch compileSdk for usb_serial
        script: |
          # 1. Forzar compileSdk 34 en el proyecto principal
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle || true
          
          # 2. Buscar el archivo build.gradle del plugin usb_serial y forzar compileSdkVersion 34
          find ~/.pub-cache -name "build.gradle" -path "*usb_serial*" -exec sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' {} +
          find ~/.pub-cache -name "build.gradle" -path "*usb_serial*" -exec sed -i 's/compileSdk 33/compileSdk 34/g' {} +

      - name: Build APK
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk